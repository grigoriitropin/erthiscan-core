# ALEMBIC CONFIGURATION: This file controls the migration environment.
# It defines how Alembic connects to the database and how it logs its operations.
[alembic]
# SCRIPT LOCATION: Path to the directory containing migration scripts and env.py.
script_location = alembic

# SYSTEM PATH: Adds the current directory to sys.path. 
# This is critical so Alembic can import the 'app' package to read your models.
prepend_sys_path = .

# LOGGING SETUP: Standard Python logging configuration for the migration process.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
# SQL ENGINE LOGGING: Set to INFO to see the exact SQL queries generated during migrations.
# Useful for debugging schema changes.
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
# ALEMBIC LOGGING: Tracks the migration versions being applied or reverted.
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
# LOG FORMAT: Standard timestamp and level display for CLI output.
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
