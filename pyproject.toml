[project]
name = "erthiscan-core"
version = "0.1.0"
description = "Erthiscan core API: FastAPI backend for ethical company scoring"
requires-python = ">=3.14"
dependencies = [
    "fastapi~=0.135.0",                     # High-performance async API framework
    "uvicorn[standard]~=0.41.0",           # ASGI server with uvloop support
    "asyncpg~=0.31.0",                      # Fastest async PostgreSQL driver for Python
    "SQLAlchemy[asyncio]~=2.0.48",          # Modern async ORM
    "alembic~=1.18.0",                      # Schema migration management
    "psycopg[binary]~=3.3.0",               # Needed for bulk 'COPY' operations in dump import
    "httpx~=0.28.0",                        # Async HTTP client for external API calls
    "google-auth~=2.42.0",                  # Google OAuth2 integration
    "requests~=2.32.0",                     # Synchronous HTTP client (used sparingly)
    "PyJWT~=2.10.0",                        # JWT creation and verification
    "redis[hiredis]~=5.3.0",                # Cache and distributed locking
    "aiokafka~=0.12.0",                     # Async Kafka integration for event-driven flow
    "unidecode~=1.4.0",                     # Transliteration (Nestlé -> Nestle)
    "pydantic~=2.12.0",                     # Data validation and serialization
    "pydantic-settings~=2.11.0",            # Environment variable management
    "slowapi~=0.1.9",                       # Rate limiting middleware
    "structlog~=25.5.0",                    # Structured JSON logging for observability
    "prometheus-fastapi-instrumentator~=7.1.0", # Metrics for Grafana dashboards
]

[project.optional-dependencies]
dev = [
    "pytest~=8.3",
    "pytest-asyncio~=0.24",
    "ruff~=0.8",
    "mypy~=1.13",
    "types-requests",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF"]
ignore = ["S101", "E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"alembic/**" = ["S"]
"tests/**" = ["S"]
"app/collector/**" = ["S310", "SIM117", "B007"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: tests that require external services (PostgreSQL, Redis, Kafka)",
]
